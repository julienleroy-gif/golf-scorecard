<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSA Golf - Dashboard Capitaine (Ryder Cup Style)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-3 sm:p-4">

    <!-- En-tête -->
    <header class="bg-emerald-900 text-white p-3 rounded-xl shadow-md flex justify-between items-center max-w-3xl mx-auto w-full">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🏆</span>
            <div>
                <h1 class="text-base font-bold">Golf de Rouen MSA</h1>
                <p class="text-[11px] text-emerald-300">Live Capitaine • Coupe de Normandie</p>
            </div>
        </div>
        <button onclick="loadLiveScores()" class="bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow">
            <span>🔄 Actualiser</span>
        </button>
    </header>

    <!-- Corps de la page -->
    <main class="flex-1 max-w-3xl mx-auto w-full space-y-3 mt-3">
        
        <!-- Barre de contrôle & Filtre date -->
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between text-xs gap-2">
            <div>
                <span class="text-slate-400">Date :</span>
                <input type="date" id="filter-date" onchange="loadLiveScores()" class="bg-slate-800 border border-slate-700 rounded p-1 text-white ml-1.5 font-medium">
            </div>
            <div id="last-update" class="text-emerald-400 font-medium">En attente...</div>
        </div>

        <!-- Conteneur des Matchs (Style Ryder Cup) -->
        <div id="matches-container" class="space-y-2">
            <div class="text-center py-12 text-slate-500 text-xs">Chargement des duels en direct...</div>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="text-center text-[10px] text-slate-600 py-3">
        MSA Golf Dashboard • Synchro Cloud Supabase ☁️
    </footer>

    <!-- Script de liaison Supabase & Live Ryder Cup -->
    <script>
        // ==========================================
        // ⚙️ TES ACCÈS SUPABASE
        // ==========================================
        const CONFIG_SUPABASE_URL = 'https://gtjyobxafohwtgugkeib.supabase.co'; 
        const CONFIG_SUPABASE_KEY = 'sb_publishable_slOa7zwBkJbhgnGvEIeJdw_se57JYRX';
        // ==========================================

        let supabaseClient = null;

        window.onload = function() {
            document.getElementById('filter-date').valueAsDate = new Date();
            initSupabase();
            loadLiveScores();

            // Actualisation automatique toutes les 30 secondes
            setInterval(loadLiveScores, 30000);
        };

        function initSupabase() {
            try {
                supabaseClient = window.supabase.createClient(CONFIG_SUPABASE_URL, CONFIG_SUPABASE_KEY);
            } catch(e) {
                console.error(e);
            }
        }

        async function loadLiveScores() {
            if(!supabaseClient) return;

            const selectedDate = document.getElementById('filter-date').value;
            const updateEl = document.getElementById('last-update');
            updateEl.textContent = "Mise à jour...";

            const { data, error } = await supabaseClient
                .from('scores_golf')
                .select('*')
                .eq('date_partie', selectedDate)
                .order('numero_trou', { ascending: true });

            if(error) {
                console.error(error);
                updateEl.textContent = "Erreur de synchro";
                return;
            }

            updateEl.textContent = "À jour " + new Date().toLocaleTimeString();
            renderRyderCupDashboard(data);
        }

        function renderRyderCupDashboard(rows) {
            const container = document.getElementById('matches-container');

            if(!rows || rows.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-xl text-center text-slate-500 text-xs">
                        Aucun score enregistré pour cette date.
                    </div>
                `;
                return;
            }

            // Regroupement par match_id
            const matchesMap = {};
            rows.forEach(r => {
                const matchId = r.match_id || 'Match Libre';
                if(!matchesMap[matchId]) matchesMap[matchId] = {};
                
                const player = r.nom_joueur || 'Inconnu';
                if(!matchesMap[matchId][player]) {
                    matchesMap[matchId][player] = { totalBrut: 0, holesPlayed: 0, standing: 0 };
                }

                if(r.numero_trou) {
                    matchesMap[matchId][player].totalBrut += (r.score_brut || 0);
                    matchesMap[matchId][player].holesPlayed++;
                    
                    if(r.resultat_trou === 'gagne') matchesMap[matchId][player].standing++;
                    if(r.resultat_trou === 'perdu') matchesMap[matchId][player].standing--;
                }
            });

            // Construction du rendu compact type Ryder Cup
            container.innerHTML = Object.keys(matchesMap).map(matchId => {
                const players = matchesMap[matchId];
                const playerNames = Object.keys(players);

                // On prend le premier joueur à gauche et le second à droite (s'il existe)
                const p1Name = playerNames[0] || 'En attente';
                const p1Data = players[p1Name] || { totalBrut: 0, holesPlayed: 0, standing: 0 };

                const p2Name = playerNames[1] || 'En attente adversaire';
                const p2Data = players[p2Name] || { totalBrut: 0, holesPlayed: 0, standing: 0 };

                // Calcul du statut du match (Basé sur le standing du joueur 1)
                let statusText = "AS";
                let statusClass = "bg-slate-800 text-slate-300 border-slate-700";

                if (p1Data.standing > 0) {
                    statusText = `${p1Data.standing} Up`;
                    statusClass = "bg-emerald-950 text-emerald-400 border-emerald-800";
                } else if (p1Data.standing < 0) {
                    statusText = `${Math.abs(p1Data.standing)} Down`;
                    statusClass = "bg-rose-950 text-rose-400 border-rose-800";
                }

                if (p1Data.holesPlayed >= 18 && p1Data.standing !== 0) {
                    statusText = p1Data.standing > 0 ? "Victoire" : "Défaite";
                }

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center shadow-md">
                        <!-- Joueur 1 (Gauche) -->
                        <div class="w-[38%] text-right pr-2">
                            <div class="font-bold text-xs sm:text-sm text-white truncate">${p1Name}</div>
                            <div class="text-[10px] text-slate-400">Trous : ${p1Data.holesPlayed} • Brut : <strong class="text-emerald-400">${p1Data.totalBrut}</strong></div>
                        </div>

                        <!-- Statut du Match (Centre style Ryder Cup) -->
                        <div class="w-[24%] text-center">
                            <div class="text-[9px] uppercase tracking-wider text-slate-500 font-semibold mb-0.5">${matchId}</div>
                            <div class="border rounded-lg py-1 px-1 text-xs font-black tracking-wide shadow-inner ${statusClass}">
                                ${statusText}
                            </div>
                        </div>

                        <!-- Joueur 2 (Droite) -->
                        <div class="w-[38%] text-left pl-2">
                            <div class="font-bold text-xs sm:text-sm text-slate-300 truncate">${p2Name}</div>
                            <div class="text-[10px] text-slate-400">Trous : ${p2Data.holesPlayed} • Brut : <strong class="text-white">${p2Data.totalBrut}</strong></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
